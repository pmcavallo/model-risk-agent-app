# Streamlit theme for the Model Risk Analyst Agent UI.
# Clean, professional, readable — matches a data/analytics tool.
[theme]
primaryColor = "#2563eb"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f1f5f9"
textColor = "#0f172a"
font = "sans serif"

[server]
# Streamlit Community Cloud sets its own port; this is only for local runs.
headless = true
